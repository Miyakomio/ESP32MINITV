[platformio]
; 编译产物放到纯英文路径。
; 原因：工程在中文目录下时，链接器写 firmware.map 会失败
;      （cannot open map file ... No such file or directory）
build_dir = C:/Users/25023/Documents/pio_build/minitv

[env:esp32s3_n16r8]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16    ; N16R8：16MB Flash + 8MB(八线) PSRAM
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; upload_port = COM16        ; 插上板子后如果自动识别不到，再打开这行并改成实际端口


build_flags =
    -mfix-esp32-psram-cache-issue
    -DLV_CONF_INCLUDE_SIMPLE
    ; 让 Serial 输出走到原生 USB（COM16）；不加的话默认走 UART0，电脑上看不到日志
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; 让库编译也能找到工程 include/ 目录（PlatformIO 默认只给 src/ 加这个路径）
    -I${PROJECT_DIR}/include

    ; ------------------------------------------------------------------
    ; LVGL 配置：直接写成编译参数。
    ; 原因：PlatformIO 编译库文件时不把工程 include/ 加进搜索路径，
    ;      LVGL 读不到 include/lv_conf.h，就退回它内部的默认值——
    ;      默认值会启用全部控件（要编 551 个文件），而且没有 montserrat_16 字体。
    ; 下面这些和 include/lv_conf.h 一致，两边都留着更保险。
    ; ------------------------------------------------------------------
    -DLV_COLOR_FORMAT_DEFAULT=LV_COLOR_FORMAT_RGB565
    -DLV_MEM_SIZE=65536
    -DLV_DEF_REFR_PERIOD=16

    ; 字体：写界面要用 16 号做标题，必须显式打开
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_16=1
    ; 时钟界面要用大字号（必须和 include/lv_conf.h 保持一致，否则链接报 undefined reference）
    -DLV_FONT_MONTSERRAT_28=1
    -DLV_FONT_MONTSERRAT_40=1

    ; 主题：只留默认主题
    -DLV_USE_THEME_SIMPLE=0
    -DLV_USE_THEME_MONO=0

    ; 用不到的控件（每关一个就少编一个文件，直接缩短编译时间）
    -DLV_USE_ANIMIMG=0
    -DLV_USE_ARCLABEL=0
    -DLV_USE_BUTTONMATRIX=0
    -DLV_USE_CALENDAR=0
    -DLV_USE_CHART=0
    -DLV_USE_DROPDOWN=0
    -DLV_USE_IMAGEBUTTON=0
    -DLV_USE_KEYBOARD=0
    -DLV_USE_MENU=0
    -DLV_USE_MSGBOX=0
    -DLV_USE_ROLLER=0
    -DLV_USE_SCALE=0
    -DLV_USE_SPAN=0
    -DLV_USE_SPINBOX=0
    -DLV_USE_TABLE=0
    -DLV_USE_TABVIEW=0
    -DLV_USE_TEXTAREA=0
    -DLV_USE_TILEVIEW=0
    -DLV_USE_WIN=0

    ; 图片解码 / 第三方库（要用再加回来）
    -DLV_USE_LODEPNG=0
    -DLV_USE_LIBPNG=0
    -DLV_USE_BMP=0
    -DLV_USE_TJPGD=0
    -DLV_USE_GIF=0
    -DLV_USE_QRCODE=0
    -DLV_USE_BARCODE=0
    -DLV_USE_FREETYPE=0
    -DLV_USE_TINY_TTF=0
    -DLV_USE_RLOTTIE=0
    -DLV_USE_FFMPEG=0
    -DLV_USE_THORVG=0
    -DLV_USE_LZ4=0
lib_deps =
	lvgl/lvgl@^9.6.0
	lovyan03/LovyanGFX@^0.4.18
	; TinyPMU（AXP173 电源管理驱动）已放进工程 lib/，且做成了自包含库：
	;   lib/TinyPMU/                   TinyPMU.h / AXP173 / AXP2101
	;   lib/TinyPMU/HARDWARE-PORT/     它依赖的 I2C/GPIO 基类
	; 注意：不要再用 lib_deps 从 GitHub 单独装 TinyPMU —— 它的头文件原本写的是
	;   #include "../../HARDWARE-PORT/HARDWARE_PORT.h"（指向库外面）
	; 单独装必然找不到，这就是之前的编译错误。现在已经改成库内路径。
